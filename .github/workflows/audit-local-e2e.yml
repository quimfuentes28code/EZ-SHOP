name: Audit full local E2E 2026-10-30
on:
  push:
    branches: ["audit/full-review-20261030"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run all local Playwright E2E suites
        run: npm run test:e2e
      - name: Upload trace on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonoservice-local-e2e-artifacts
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

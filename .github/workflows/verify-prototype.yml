name: Verify web prototype

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify static output
        run: |
          test -f out/index.html
          test -f out/empresa.html
          test -f out/cliente.html
          test -f out/explorar.html
          test -f out/registro/empresa.html
          test -f out/registro/cliente.html
          test -f out/real.html
          test -f out/negocio/photo.html
          test -f out/negocio/beauty.html
          test -f out/negocio/bakery.html
          test -f out/negocio/repairs.html

name: Generate official mobile app icons
on:
  push:
    branches: ["fix/ios-home-icon-20261030"]
    paths:
      - "scripts/generate-app-icons.py"
      - ".github/workflows/generate-ios-icon.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet cairosvg pillow
      - name: Convert existing official SVG to iOS and Android PNGs
        run: python scripts/generate-app-icons.py
      - name: Commit icon assets on the feature branch
        run: |
          git add src/app/apple-icon.png public/apple-touch-icon.png public/icons/autonoservice-192.png public/icons/autonoservice-512.png
          if git diff --cached --quiet; then
            echo "Icons already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Generar PNGs del logo oficial para iOS y Android"
            git push origin HEAD:refs/heads/fix/ios-home-icon-20261030
          fi

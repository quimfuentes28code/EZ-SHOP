name: Sync Supabase package lock (temporary)
on:
  push:
    branches: [feature/real-accounts-crm-v1]
    paths:
      - package.json
      - .github/workflows/sync-supabase-lock.yml
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/real-accounts-crm-v1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate official dependency lock from npm
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lock only if modified
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Lock Supabase JS SDK dependencies"
            git push origin HEAD:feature/real-accounts-crm-v1
          fi

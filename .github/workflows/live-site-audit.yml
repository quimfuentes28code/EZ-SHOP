name: Live published site browser audit

on:
  push:
    branches:
      - audit/live-site-smoke-20261030
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test deployed Cloudflare URLs with desktop and mobile browser
        run: node scripts/audit-live.mjs
      - name: Upload screenshots for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-site-audit-screenshots
          path: audit-screenshots/
          retention-days: 3
          if-no-files-found: ignore
